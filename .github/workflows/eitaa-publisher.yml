name: Eitaa scheduled publishing

on:
  schedule:
    # Tehran time (UTC+03:30): 08:30, 10:00, 11:30, 13:00, 14:30, 16:00, 18:00, 19:30, 21:00
    - cron: "0 5 * * *"
    - cron: "30 6 * * *"
    - cron: "0 8 * * *"
    - cron: "30 9 * * *"
    - cron: "0 11 * * *"
    - cron: "30 12 * * *"
    - cron: "30 14 * * *"
    - cron: "0 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eitaa-scheduled-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Publish educational post
        env:
          EITAAYAR_TOKEN: ${{ secrets.EITAAYAR_TOKEN }}
        run: python scripts/eitaayar_publisher.py
